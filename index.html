<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Page Heading Card -->
    <header class="heading-card">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <!-- Add Expense Card -->
    <section class="card">
        <h2>Add Expense</h2>

        <form>
            <label for="expense-name">Expense Name</label>
            <input type="text" id="expense-name" placeholder="Enter expense name">

            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount">

            <label for="category">Category</label>
            <select id="category">
                <option value="">Select category</option>
                <option>Food</option>
                <option>Transport</option>
                <option>Entertainment</option>
                <option>Bills</option>
                <option>Other</option>
            </select>

            <button type="submit">Add Expense</button>
        </form>
    </section>

    <!-- Expense Table Card -->
    <section class="card">
        <h2>Your Expenses</h2>

        <table>
            <thead>
                <tr>
                    <th>Expense Name</th>
                    <th>Amount</th>
                    <th>Category</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Lunch</td>
                    <td>KSh 500</td>
                    <td>Food</td>
                </tr>

                <tr>
                    <td>Bus Fare</td>
                    <td>KSh 200</td>
                    <td>Transport</td>
                </tr>

                <tr>
                    <td>Movie</td>
                    <td>KSh 800</td>
                    <td>Entertainment</td>
                </tr>
            </tbody>
        </table>
    </section>

</body>
</html>
